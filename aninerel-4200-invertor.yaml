button:
  # Exit the fault mode                                           Uint  426   W   1: Exit the fault state
  - platform: template
    name: "Exit fault state"
    icon: mdi:restore
    on_press:
      then:
        - lambda: |-
            auto cmd = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(id(smg0), 426, 1, {1});
            id(smg0)->queue_command(cmd);
  - platform: template
    name: "Set PV total energy"
    id: pv_energy_total_set_button
    entity_category: config
    on_press:
      - lambda: |-
          float value = id(pv_energy_total_correction).state;

          // Записываем только реальное положительное значение
          if (!isnan(value) && value > 0.0f) {
            id(pv_energy_total) = value;

            ESP_LOGI("pv_energy",
                     "PV total energy manually set to %.2f kWh",
                     value);
          } else {
            ESP_LOGW("pv_energy",
                     "PV total energy correction ignored: invalid value %.2f",
                     value);
          }
