substitutions:
  name: "aninerel4200"
  friendly_name: "Aninerel4200"
  tx_pin: GPIO21
  rx_pin: GPIO20
  device_ip: 192.168.0.116
  version: "05.10.2026"
  reboot_timeout: 0s  
  flash_write_interval: 10min # Сохраняем globals во flash раз в 5 минут. # Значения между сохранениями живут в RAM. 
<<: !include attach/common/esphome.yaml
<<: !include attach/common/esp/esp32_c3_idf.yaml
<<: !include attach/common/logger/debug_component_error.yaml
<<: !include attach/common/api.yaml
<<: !include attach/common/ota.yaml
<<: !include attach/common/wifi.yaml
<<: !include attach/common/web/web_server3.yaml
packages:
  common: !include attach/packages/standart.yaml

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms
    turnaround_time: 200ms
modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    update_interval: 10s
  - id: smg_settings
    address: 0x01
    modbus_id: modbus0
    update_interval: 60s
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Moscow
    servers:
     - 0.ru.pool.ntp.org
     - ntp0.ntp-servers.net
     - 2.pool.ntp.org
  - platform: homeassistant
    id: homeassistant_time

globals: 
  # Накопленная энергия PV за всё время 
  - id: pv_energy_total 
    type: float 
    restore_value: true 
    initial_value: "0.0" 
  # Энергия PV за текущие сутки 
  - id: pv_energy_today 
    type: float 
    restore_value: true 
    initial_value: "0.0"
    # Энергия из сети за текущие сутки
  - id: grid_import_energy_today
    type: float
    restore_value: true
    initial_value: "0.0"
  # Текущий день для обоих daily-счётчиков. Формат YYYYMMDD.
  - id: energy_day
    type: int
    restore_value: true
    initial_value: "0"
# === # ENERGY CALCULATOR # == 
interval:
  - interval: 10s
    then:
      - lambda: |-
          // ТЕКУЩАЯ ДАТА
          auto time = id(homeassistant_time).now();
          if (!time.is_valid()) {
            return;
          }
          int today =
              time.year * 10000 +
              time.month * 100 +
              time.day_of_month;
          // НОВЫЕ СУТКИ Сбрасываем оба daily-счётчика одновременно
          if (id(energy_day) != today) {
            id(pv_energy_today) = 0.0f;
            id(grid_import_energy_today) = 0.0f;
            id(energy_day) = today;
          }
          // PV ENERGY Текущая мощность PV в ваттах
          float pv_power = id(smg0_pv_average_power).state;
          // Если Modbus ещё не дал нормальное значение — PV энергию сейчас не считаем
          if (!isnan(pv_power) &&
              pv_power >= 0.0f &&
              pv_power <= 10000.0f) {
            // Энергия за 10 секунд:
            // W * seconds / 3600 = Wh
            // /1000 = kWh
            float pv_energy_kwh =
                pv_power * 10.0f / 3600000.0f;
            id(pv_energy_today) += pv_energy_kwh;
            id(pv_energy_total) += pv_energy_kwh;
          }
          // GRID IMPORT ENERGY
          // Время между измерениями.
          const float dt_hours = 10.0f / 3600.0f;

          float grid_power = id(average_mains_power).state;
          if (!isnan(grid_power) && grid_power > 0.0f) {
            float grid_energy_kwh =
                grid_power * dt_hours / 1000.0f;
            id(grid_import_energy_today) += grid_energy_kwh;
          }
sensor:
  - platform: template 
    name: "PV energy today" 
    id: pv_energy_today_sensor 
    unit_of_measurement: "kWh" 
    device_class: energy 
    state_class: total 
    icon: mdi:solar-power-variant 
    accuracy_decimals: 2 
    lambda: |- 
      return id(pv_energy_today); 
    update_interval: 30s 
  - platform: template 
    name: "PV energy total" 
    id: pv_energy_total_sensor 
    unit_of_measurement: "kWh" 
    device_class: energy 
    state_class: total_increasing 
    icon: mdi:solar-power 
    accuracy_decimals: 2 
    lambda: |- 
      return id(pv_energy_total); 
    update_interval: 30s
  - platform: template
    id: grid_import_energy_today_sensor
    name: "Grid import energy today"
    icon: mdi:transmission-tower-import
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    lambda: |-
      return id(grid_import_energy_today);
    update_interval: 30s
  - platform: template
    name: "PV to home power"
    id: pv_to_home_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(output_active_power).state) ||
          isnan(id(average_mains_power).state)) {
        return {};
      }
      float output_power = id(output_active_power).state;
      float grid_power = id(average_mains_power).state;
      float power = output_power - grid_power;
      return power > 0.0f ? power : 0.0f;
  - platform: total_daily_energy
    name: "Inverter total consumption today"
    power_id: output_active_power
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 2
    method: trapezoid
    filters:
      - lambda: |-
          return x < 0.0f ? 0.0f : x;
      - multiply: 0.001
  - platform: template
    name: "Discharging power"
    id: smg0_discharging_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:battery-arrow-down
    # Gets updated on value of smg0_battery_average_power
    update_interval: never
    lambda: |-
      if (isnan(id(smg0_battery_average_power).state)) {
        return {};
      }
      auto power = id(smg0_battery_average_power).state;
      return (power < 0.0f) ? -power : 0.0f;

  - platform: template
    name: "Charging power"
    id: smg0_charging_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:battery-charging
    # Gets updated on value of smg0_battery_average_power
    update_interval: never
    lambda: |-
      if (isnan(id(smg0_battery_average_power).state)) {
        return {};
      }
      auto power = id(smg0_battery_average_power).state;
      return (power > 0.0f) ? power : 0.0f;

